name: snaffler-ng CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Ruff lint
        run: uv run ruff check snaffler/

      - name: Ruff format check
        run: uv run ruff format --check snaffler/

      - name: Mypy type check
        run: uv run mypy snaffler/

      - name: Dependency vulnerability check
        run: uv run --with pip-audit pip-audit

  test-build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Run tests
        run: uv run pytest tests/unit/ -v --tb=short --cov=snaffler --cov-fail-under=85

      - name: Build package
        run: uv build

      - name: Upload dist
        if: github.ref == 'refs/heads/master' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  build-binary:
    needs: test-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.22.3

      - name: Build binary
        run: |
          pyinstaller --onefile --name snaffler-linux-x86_64 \
            --exclude-module matplotlib \
            --exclude-module PyQt5 \
            --exclude-module PyQt6 \
            --exclude-module PySide6 \
            --exclude-module tkinter \
            --exclude-module _tkinter \
            --exclude-module PIL \
            --exclude-module numpy \
            --exclude-module pygame \
            --exclude-module IPython \
            --exclude-module pytest \
            --exclude-module jedi \
            --exclude-module astroid \
            --exclude-module impacket.examples.ntlmrelayx \
            --exclude-module impacket.examples.mssqlshell \
            --exclude-module impacket.examples.ldap_shell \
            --exclude-module impacket.mqtt \
            --exclude-module impacket.Dot11Crypto \
            --exclude-module impacket.Dot11KeyManager \
            snaffler/cli/main.py

      - name: Smoke test
        run: ./dist/snaffler-linux-x86_64 --version

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binary
          path: dist/snaffler-linux-x86_64

  build-binary-arm64:
    needs: test-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.22.3

      - name: Build binary
        run: |
          pyinstaller --onefile --name snaffler-linux-aarch64 \
            --exclude-module matplotlib \
            --exclude-module PyQt5 \
            --exclude-module PyQt6 \
            --exclude-module PySide6 \
            --exclude-module tkinter \
            --exclude-module _tkinter \
            --exclude-module PIL \
            --exclude-module numpy \
            --exclude-module pygame \
            --exclude-module IPython \
            --exclude-module pytest \
            --exclude-module jedi \
            --exclude-module astroid \
            --exclude-module impacket.examples.ntlmrelayx \
            --exclude-module impacket.examples.mssqlshell \
            --exclude-module impacket.examples.ldap_shell \
            --exclude-module impacket.mqtt \
            --exclude-module impacket.Dot11Crypto \
            --exclude-module impacket.Dot11KeyManager \
            snaffler/cli/main.py

      - name: Smoke test
        run: ./dist/snaffler-linux-aarch64 --version

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-arm64
          path: dist/snaffler-linux-aarch64

  build-binary-windows:
    needs: test-build
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.22.3

      - name: Build binary
        run: |
          pyinstaller --onefile --name snaffler-windows-x86_64 `
            --exclude-module matplotlib `
            --exclude-module PyQt5 `
            --exclude-module PyQt6 `
            --exclude-module PySide6 `
            --exclude-module tkinter `
            --exclude-module _tkinter `
            --exclude-module PIL `
            --exclude-module numpy `
            --exclude-module pygame `
            --exclude-module IPython `
            --exclude-module pytest `
            --exclude-module jedi `
            --exclude-module astroid `
            --exclude-module impacket.examples.ntlmrelayx `
            --exclude-module impacket.examples.mssqlshell `
            --exclude-module impacket.examples.ldap_shell `
            --exclude-module impacket.mqtt `
            --exclude-module impacket.Dot11Crypto `
            --exclude-module impacket.Dot11KeyManager `
            snaffler/cli/main.py

      - name: Smoke test
        run: .\dist\snaffler-windows-x86_64.exe --version

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-windows
          path: dist/snaffler-windows-x86_64.exe

  build-deb:
    needs: test-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container: kalilinux/kali-rolling@sha256:8913de4b58eeeff681a1e62653c0f4369520f65fb419932cca0acac162f3509e

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper=14.5 \
            dh-python=7.20261019 \
            pybuild-plugin-pyproject=7.20261019 \
            python3-all \
            python3-setuptools \
            python3-impacket=0.13.1-1 \
            python3-typer=0.20.0-2 \
            python3-tomlkit=0.13.3-3 \
            python3-cryptography=49.0.0-2 \
            python3-rich=15.0.0-2 \
            python3-rarfile \
            lintian

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          cp ../snaffler-ng_*.deb .

      - name: Lint .deb
        run: lintian --no-tag-display-limit snaffler-ng_*.deb || true

      - name: Upload deb
        uses: actions/upload-artifact@v7.0.2
        with:
          name: deb
          path: snaffler-ng_*.deb

  version-check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check whether this version is already released
        id: check
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION already exists, skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new, will release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [version-check, test-build, build-binary, build-binary-arm64, build-binary-windows, build-deb]
    if: github.ref == 'refs/heads/master' && needs.version-check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Download dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: binary
          path: binary/

      - name: Download ARM64 binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: binary-arm64
          path: binary-arm64/

      - name: Download Windows binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: binary-windows
          path: binary-windows/

      - name: Download deb
        uses: actions/download-artifact@v8.0.2
        with:
          name: deb
          path: deb/

      - name: Publish to PyPI
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Generate SHA256 checksums
        run: |
          sha256sum binary/snaffler-linux-x86_64 \
                    binary-arm64/snaffler-linux-aarch64 \
                    binary-windows/snaffler-windows-x86_64.exe \
                    deb/*.deb \
                    dist/*.tar.gz \
                    dist/*.whl \
            | sed 's|  .*/|  |' > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          name: v${{ needs.version-check.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
            binary/snaffler-linux-x86_64
            binary-arm64/snaffler-linux-aarch64
            binary-windows/snaffler-windows-x86_64.exe
            deb/*.deb
            SHA256SUMS.txt
