[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snaffler-ng"
version = "1.6.0"
description = "Find credentials and sensitive data on SMB shares, FTP servers, and local filesystems"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "totekuh", email = "totekuh@protonmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

dependencies = [
    "impacket>=0.11.0",
    "typer>=0.15.0,<0.29",
    "rich>=13.0.0",
    "tomlkit>=0.12.0",
    "rarfile>=4.0",
]

[project.scripts]
snaffler = "snaffler.cli.main:app"

[tool.setuptools]
packages = { find = { exclude = ["tests", "tests.*"] } }

[tool.setuptools.package-data]
snaffler = ["rules/*.toml", "web/static/*", "web/static/css/*", "web/static/js/*"]

[project.urls]
Homepage = "https://github.com/totekuh/snaffler-ng"
Repository = "https://github.com/totekuh/snaffler-ng"
Issues = "https://github.com/totekuh/snaffler-ng/issues"
Kali = "https://gitlab.com/kalilinux/packages/snaffler-ng"

[project.optional-dependencies]
socks = ["pysocks>=1.7.0"]
web = ["flask>=3.0.0"]
7z = ["py7zr>=0.20.0"]
all = [
    "pysocks>=1.7.0",
    "flask>=3.0.0",
    "py7zr>=0.20.0",
]
test = [
    "snaffler-ng[all]",
    "pytest>=8.0",
    "pytest-cov",
    "pyftpdlib>=2.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "UP006",   # List vs list — defer to future-annotations migration
    "UP035",   # deprecated typing imports — same
    "UP045",   # Optional[X] vs X | None — same
    "SIM105",  # contextlib.suppress — scanner intentionally catches broad exceptions to keep going
    "SIM102",  # collapsible-if — nested ifs often clearer in scan logic
    "SIM108",  # ternary — style preference, not a bug
    "B904",    # raise-from — tedious, low value in scanner error paths
    "B027",    # empty-method-no-abstract — intentional base class stubs
    "RUF013",  # implicit-optional — related to UP045, defer
    "E501",    # line-too-long — ruff format handles wrapping, remaining are long strings/URLs
]

[tool.ruff.lint.per-file-ignores]
"snaffler/cli/*.py" = ["B008"]  # typer.Option() in defaults is standard pattern
"tests/**/*.py" = ["E402"]  # imports after pytest.importorskip is standard pattern

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "snaffler.resume.scan_state.sqlite_computers",
    "snaffler.resume.scan_state.sqlite_shares",
    "snaffler.resume.scan_state.sqlite_files",
    "snaffler.resume.scan_state.sqlite_dirs_findings",
    "snaffler.engine.runner_discovery",
    "snaffler.engine.runner_filters",
]
ignore_errors = true