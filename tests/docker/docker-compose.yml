services:
  samba:
    build:
      context: samba
    volumes:
      - ../data:/srv/testdata:ro
    healthcheck:
      test: ["CMD", "smbclient", "-L", "//127.0.0.1", "-N"]
      interval: 2s
      timeout: 3s
      retries: 5

  dc:
    build:
      context: dc
    hostname: dc01
    domainname: testlab.local
    privileged: true
    environment:
      REALM: TESTLAB.LOCAL
      DOMAIN: TESTLAB
      ADMIN_PASS: "Passw0rd!Testing"
    volumes:
      - samba-data:/var/lib/samba
      - samba-etc:/etc/samba
      - samba-shares:/srv/shares
    tmpfs:
      - /run
    healthcheck:
      test: ["CMD", "samba-tool", "domain", "info", "127.0.0.1"]
      interval: 5s
      timeout: 10s
      retries: 24
    profiles: ["ad"]

  testrunner:
    build:
      context: ../../
      dockerfile: tests/docker/testrunner/Dockerfile
    depends_on:
      samba:
        condition: service_healthy
    environment:
      - SMB_HOST=samba
      - AD_DC_HOST=dc
      - SNAFFLER_TEST_DOCKER=1
    command: python3 -m pytest tests/integration/ -v --tb=short

  socks-runner:
    build:
      context: ../../
      dockerfile: tests/docker/testrunner/Dockerfile
    depends_on:
      socks5-proxy:
        condition: service_healthy
      socks4-proxy:
        condition: service_healthy
      socks-target:
        condition: service_healthy
    networks:
      external_net:
        ipv4_address: 10.55.0.10
    environment:
      - SOCKS_PROXY_HOST=10.55.0.2
      - SOCKS4_PROXY_HOST=10.55.0.3
      - SOCKS_TARGET_HOST=socks-target
      - SOCKS_TARGET_IP=10.56.0.2
      - SNAFFLER_TEST_DOCKER=1
    command: python3 -m pytest tests/integration/test_socks_proxy.py -v --tb=short
    profiles: ["socks"]

  socks5-proxy:
    build:
      context: socks
    command: ["socks5"]
    networks:
      external_net:
        ipv4_address: 10.55.0.2
      internal_net:
        ipv4_address: 10.56.0.3
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1080"]
      interval: 2s
      timeout: 3s
      retries: 5
    profiles: ["socks"]

  socks4-proxy:
    build:
      context: socks
    command: ["socks4"]
    networks:
      external_net:
        ipv4_address: 10.55.0.3
      internal_net:
        ipv4_address: 10.56.0.4
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1080"]
      interval: 2s
      timeout: 3s
      retries: 5
    profiles: ["socks"]

  socks-target:
    build:
      context: samba
    volumes:
      - ../data:/srv/testdata:ro
    networks:
      internal_net:
        ipv4_address: 10.56.0.2
    healthcheck:
      test: ["CMD", "smbclient", "-L", "//127.0.0.1", "-N"]
      interval: 2s
      timeout: 3s
      retries: 5
    profiles: ["socks"]

volumes:
  samba-data:
  samba-etc:
  samba-shares:

networks:
  external_net:
    ipam:
      config:
        - subnet: 10.55.0.0/24
  internal_net:
    internal: true
    ipam:
      config:
        - subnet: 10.56.0.0/24
